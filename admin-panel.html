<!-- =========================================================================================
     קטע זה (admin-panel.html) נטען דינמית בזמן ריצה על ידי index.html — הוא לא קובץ עצמאי
     שנפתח ישירות בדפדפן. אם פותחים אותו לבד הוא ייראה לא מעוצב, וזה תקין ומצופה.
     כאן חי כל דף הניהול: העיצוב (style), התבנית (כפתור המנעול + חלון הניהול), והלוגיקה (script).
     גישה: לחיצה על כפתור המנעול למטה-ימין באתר הראשי.
     הסיסמה ומפתחות GitHub נשמרים ב-Environment Variables ב-Vercel בלבד - לא בקובץ הזה.
     ========================================================================================= -->

     דף מנהלים — עריכת data.json דרך הדפדפן (ללא תכנות)

<style>
#adminFab{
  position:fixed; right:18px; bottom:18px; z-index:9000;
  width:44px; height:44px; border-radius:50%; cursor:pointer;
  border:1px solid rgba(46,33,48,.15); background:var(--panel,#fff);
  color:var(--ink-soft,#6E5B60); font-size:18px; opacity:.45;
  box-shadow:0 6px 18px -10px rgba(46,33,48,.6); transition:opacity .2s;
}
#adminFab:hover{opacity:1;}
#adminOverlay{
  position:fixed; inset:0; z-index:9500; display:none;
  background:rgba(46,33,48,.55); backdrop-filter:blur(3px);
  overflow:hidden; padding:20px 12px;
}
#adminOverlay.open{display:flex; justify-content:center; align-items:stretch;}
.admin-shell{
  width:100%; max-width:960px; margin:0 auto; background:var(--panel,#FFFAF2);
  border-radius:16px; box-shadow:0 24px 60px -24px rgba(46,33,48,.7);
  padding:0 18px; font-family:'Assistant',sans-serif;
  display:flex; flex-direction:column; max-height:100%; min-height:0; overflow:hidden;
}
.admin-top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.admin-top h2{font-size:22px;}
.admin-btn{
  border:0; border-radius:10px; padding:9px 16px; font-weight:700; cursor:pointer;
  font-family:inherit; font-size:14px; background:var(--olive,#D9603D); color:#fff;
}
.admin-btn.ghost{background:var(--panel-2,#F9EADB); color:var(--ink,#2E2130); border:1px solid rgba(46,33,48,.12);}
.admin-btn.danger{background:var(--closed,#A23B2E); color:#fff;}
.admin-btn.small{padding:5px 10px; font-size:12.5px;}
.admin-btn:disabled{opacity:.5; cursor:not-allowed;}
.admin-login{max-width:380px; margin:40px auto; text-align:center;}
.admin-login input{
  width:100%; padding:11px 13px; border-radius:10px; font-size:16px; font-family:inherit;
  border:1px solid rgba(46,33,48,.2); margin:14px 0; text-align:center;
}
.admin-tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.admin-tab{
  border:1px solid rgba(46,33,48,.12); background:var(--panel-2,#F9EADB); color:var(--ink,#2E2130);
  border-radius:999px; padding:7px 14px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:600;
}
.admin-tab.active{background:var(--olive-dark,#3B2A52); color:#fff; border-color:transparent;}
.admin-pane{display:none;}
.admin-pane.active{display:block;}
.admin-card{
  border:1px solid rgba(46,33,48,.12); border-radius:12px; padding:12px;
  margin-bottom:12px; background:#fff;
}
.admin-card h4{margin:0 0 8px; font-size:16px; color:var(--olive-dark,#3B2A52); font-family:'Heebo',sans-serif;}
.admin-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;}
.admin-field{flex:1 1 200px; display:flex; flex-direction:column; gap:4px;}
.admin-field.wide{flex:1 1 100%;}
.admin-field label{font-size:12.5px; color:var(--ink-soft,#6E5B60); font-weight:600;}
.admin-field input,.admin-field textarea,.admin-field select{
  padding:8px 10px; border-radius:8px; border:1px solid rgba(46,33,48,.2);
  font-family:inherit; font-size:14px; background:#fff; color:var(--ink,#2E2130);
}
.admin-field textarea{min-height:70px; resize:vertical;}
.admin-hint{font-size:12px; color:var(--ink-soft,#6E5B60); margin:2px 0 10px;}
.admin-status{font-size:13.5px; font-weight:700; min-height:20px;}
.admin-status.ok{color:var(--open,#4C7A4A);}
.admin-status.err{color:var(--closed,#A23B2E);}
.admin-card-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.admin-actions{background:var(--panel,#FFFAF2); padding:12px 0 4px; border-top:1px solid rgba(46,33,48,.12); margin-top:12px; position:static !important;}

/* --- מסגרת קבועה: כותרת, טאבים וחיפוש לא זזים בכלל --- */
.admin-fixed-head{
  flex:0 0 auto; margin:0 -18px 10px; padding:14px 18px 12px;
  background:var(--panel,#FFFAF2);
  border-bottom:1px solid rgba(46,33,48,.10);
  border-radius:16px 16px 0 0;
}
.admin-fixed-head h2{display:flex; align-items:center; gap:9px;}
.admin-fixed-head h2::before{
  content:''; width:6px; height:22px; border-radius:99px;
  background:linear-gradient(180deg, var(--brass,#E8A33D), var(--olive,#D9603D));
}
#adminEditor{flex:1 1 auto; min-height:0; flex-direction:column;}
.admin-tabs{
  flex:0 0 auto; background:var(--panel,#FFFAF2); padding:2px 0 8px; margin:0 0 10px;
  border-bottom:1px solid rgba(46,33,48,.08);
}
#adminPanes{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding-inline-end:2px;}
.admin-pane.active{display:flex; flex-direction:column;}
.admin-filter{
  width:100%; padding:10px 13px; border-radius:10px; border:1px solid rgba(46,33,48,.2);
  font-family:inherit; font-size:14px; background:#fff;
  position:sticky; top:0; z-index:3; margin:0 0 12px;
  box-shadow:0 6px 0 0 var(--panel,#FFFAF2), 0 14px 12px -12px rgba(46,33,48,.35);
}
.admin-filter:focus{outline:2px solid var(--brass,#E8A33D); outline-offset:1px;}
.admin-actions{flex:0 0 auto;}
.admin-login{overflow-y:auto;}
.admin-hint.admin-foot-hint{flex:0 0 auto; margin-bottom:12px;}

/* --- ליטוש עיצובי --- */
.admin-card{transition:box-shadow .18s, transform .18s, border-color .18s;}
.admin-card:hover{box-shadow:0 10px 22px -18px rgba(46,33,48,.7); border-color:rgba(46,33,48,.2);}
.admin-btn{transition:transform .12s, filter .15s;}
.admin-btn:hover{filter:brightness(1.05);}
.admin-btn:active{transform:translateY(1px);}
.admin-cat-head{
  display:flex; align-items:center; gap:8px; border-inline-start:4px solid var(--brass,#E8A33D);
  padding-inline-start:8px;
}
@keyframes adminFlash{
  0%{box-shadow:0 0 0 3px var(--brass,#E8A33D); background:#FFF8E9;}
  100%{box-shadow:0 0 0 0 rgba(232,163,61,0); background:#fff;}
}
.admin-flash{animation:adminFlash 1.5s ease-out;}
.admin-cat-head{margin:14px 0 6px; font-family:'Heebo',sans-serif; font-weight:900; color:var(--olive-dark,#3B2A52); font-size:15px;}
.admin-dirty{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--brass,#E8A33D); margin-inline-start:6px; vertical-align:middle;}
</style>

<button id="adminFab" title="כניסת מנהלים" aria-label="כניסת מנהלים">🔒</button>

<div id="adminOverlay" role="dialog" aria-label="ממשק ניהול">
  <div class="admin-shell">
    <div class="admin-top admin-fixed-head">
      <h2>ממשק ניהול תוכן</h2>
      <div style="display:flex; gap:8px;">
        <button class="admin-btn ghost" id="adminClose">סגירה</button>
      </div>
    </div>

    <div class="admin-login" id="adminLogin">
      <p>הזינו סיסמת מנהל כדי לערוך את תוכן האתר.</p>
      <input type="password" id="adminPass" placeholder="סיסמה" autocomplete="current-password">
      <button class="admin-btn" id="adminLoginBtn">כניסה</button>
      <div class="admin-status err" id="adminLoginMsg"></div>
    </div>

    <div id="adminEditor" style="display:none;">
      <div class="admin-tabs" id="adminTabs"></div>
      <div id="adminPanes"></div>
      <div class="admin-top admin-actions" style="margin-top:16px;">
        <div class="admin-status" id="adminSaveMsg"></div>
        <div style="display:flex; gap:8px;">
          <button class="admin-btn ghost" id="adminReload">טעינה מחדש (ביטול שינויים)</button>
          <button class="admin-btn" id="adminSave">שמירה ופרסום</button>
        </div>
      </div>
      <p class="admin-hint admin-foot-hint">לאחר שמירה, הקובץ מתעדכן ב-GitHub ו-Vercel מפרסם אוטומטית. ההצגה לכולם מתעדכנת תוך כדקה.</p>
    </div>
  </div>
</div>

<script>
(function(){
  const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const CATS = ['health','food','logistics','manpower','sport','transport','prayers'];
  const CAT_LABELS = {health:'בריאות', food:'אוכל', logistics:'לוגיסטיקה', manpower:'כוח אדם', sport:'ספורט ופנאי', transport:'תחבורה', prayers:'תפילות'};
  const API = '/api/update-data';

  const overlay = document.getElementById('adminOverlay');
  const fab = document.getElementById('adminFab');
  const loginBox = document.getElementById('adminLogin');
  const editorBox = document.getElementById('adminEditor');
  const passInput = document.getElementById('adminPass');
  const loginMsg = document.getElementById('adminLoginMsg');
  const saveMsg = document.getElementById('adminSaveMsg');
  const tabsEl = document.getElementById('adminTabs');
  const panesEl = document.getElementById('adminPanes');

  let password = '';
  let data = null;
  let svcFilter = '';
  let dirty = false;

  function markDirty(){
    dirty = true;
    saveMsg.className = 'admin-status';
    saveMsg.innerHTML = 'יש שינויים שלא נשמרו <span class="admin-dirty"></span>';
  }
  function markClean(){ dirty = false; }
  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function open(){ overlay.classList.add('open'); document.body.style.overflow='hidden'; }
  function close(){ if(dirty && !confirm('יש שינויים שלא נשמרו. לצאת בלי לשמור?')) return; dirty=false; overlay.classList.remove('open'); document.body.style.overflow=''; if(location.hash==='#admin') history.replaceState(null,'',location.pathname); }

  fab.addEventListener('click', open);
  document.getElementById('adminClose').addEventListener('click', close);
  if (location.hash === '#admin') open();
  window.addEventListener('hashchange', ()=>{ if(location.hash==='#admin') open(); });

  // ---------- כניסה ----------
  async function doLogin(){
    const pass = passInput.value.trim();
    if (!pass) return;
    loginMsg.textContent = 'בודק...';
    loginMsg.className = 'admin-status';
    try{
      const res = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'verify', password: pass })
      });
      const out = await res.json().catch(()=>({}));
      if (!res.ok || !out.ok) throw new Error(out.error || 'סיסמה שגויה');
      password = pass;
      passInput.value = '';
      loginMsg.textContent = '';
      loginBox.style.display = 'none';
      editorBox.style.display = 'flex';
      await loadData();
    }catch(e){
      loginMsg.className = 'admin-status err';
      loginMsg.textContent = e.message || 'שגיאה בכניסה';
    }
  }
  document.getElementById('adminLoginBtn').addEventListener('click', doLogin);
  passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  async function loadData(){
    const res = await fetch('data.json?_=' + Date.now(), { cache:'no-store' });
    data = await res.json();
    renderAll();
  }
  document.getElementById('adminReload').addEventListener('click', async ()=>{
    saveMsg.className='admin-status'; saveMsg.textContent='טוען מחדש...';
    await loadData(); markClean(); saveMsg.textContent='הנתונים נטענו מחדש מהשרת.';
  });

  // ---------- כלי בנייה ----------
  function field(label, value, path, opts){
    opts = opts || {};
    const common = 'data-path="'+esc(path)+'"';
    let input;
    if (opts.type === 'textarea')
      input = '<textarea '+common+'>'+esc(value)+'</textarea>';
    else if (opts.type === 'select')
      input = '<select '+common+'>'+opts.options.map(o=>'<option value="'+esc(o)+'"'+(o===value?' selected':'')+'>'+esc((opts.labels&&opts.labels[o])||o)+'</option>').join('')+'</select>';
    else
      input = '<input type="'+(opts.type||'text')+'" '+common+' value="'+esc(value)+'">';
    return '<div class="admin-field'+(opts.wide?' wide':'')+'"><label>'+esc(label)+'</label>'+input+'</div>';
  }

  function bind(){
    panesEl.querySelectorAll('[data-path]').forEach(el=>{
      el.oninput = ()=>{ setByPath(el.getAttribute('data-path'), el.type==='number' ? Number(el.value) : el.value); markDirty(); };
    });
  }

  function setByPath(path, value){
    const parts = path.split('|');
    let obj = data;
    for (let i=0; i<parts.length-1; i++) obj = obj[parts[i]];
    obj[parts[parts.length-1]] = value;
  }

  // ---------- לשוניות ----------
  const TABS = [
    { id:'services', label:'שירותים ושעות', render: renderServices },
    { id:'phones', label:'טלפונים', render: renderPhones },
    { id:'bus', label:'קו 10', render: renderBus },
    { id:'transport', label:'תחבורה (קו 392)', render: renderTransport },
    { id:'shuttles', label:'שאטלים', render: renderShuttles },
    { id:'guidelines', label:'דגשים ונהלים', render: renderGuidelines },
    { id:'steps', label:'תהליך קליטה', render: renderSteps }
  ];
  let activeTab = 'services';

  let focusNew = null; // פונקציה שמחזירה את האלמנט החדש שנוסף, כדי לגלול אליו

  function syncStickyHeights(){
    const shell = overlay.querySelector('.admin-shell');
    const head = overlay.querySelector('.admin-fixed-head');
    if (!shell) return;
    void head; void shell; /* המסגרת קבועה — אין צורך במדידות sticky */
  }
  window.addEventListener('resize', syncStickyHeights);

  function revealNew(){
    if (!focusNew) return;
    const getEl = focusNew; focusNew = null;
    requestAnimationFrame(()=>{
      let el = null;
      try { el = getEl(); } catch(e){}
      if (!el) return;
      const card = el.closest('.admin-card') || el;
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.remove('admin-flash');
      void card.offsetWidth;
      card.classList.add('admin-flash');
      const inp = card.querySelector('input,textarea,select');
      if (inp) setTimeout(()=>{ inp.focus({preventScroll:true}); if(inp.select) try{inp.select();}catch(e){} }, 320);
    });
  }

  function lastCardOfActivePane(){
    const pane = document.getElementById('pane-'+activeTab);
    if (!pane) return null;
    const cards = pane.querySelectorAll('.admin-card');
    return cards.length ? cards[cards.length-1] : null;
  }

  function renderAll(){
    tabsEl.innerHTML = TABS.map(t=>'<button class="admin-tab'+(t.id===activeTab?' active':'')+'" data-tab="'+t.id+'">'+esc(t.label)+'</button>').join('');
    panesEl.innerHTML = TABS.map(t=>'<div class="admin-pane'+(t.id===activeTab?' active':'')+'" id="pane-'+t.id+'">'+t.render()+'</div>').join('');
    tabsEl.querySelectorAll('.admin-tab').forEach(b=>{
      b.onclick = ()=>{ activeTab = b.getAttribute('data-tab'); renderAll(); };
    });
    panesEl.querySelectorAll('[data-action]').forEach(b=>{ b.onclick = ()=> handleAction(b.dataset.action, b.dataset.key); });
    const filterEl = document.getElementById('svcFilter');
    if (filterEl){
      filterEl.oninput = ()=>{ svcFilter = filterEl.value; renderAll(); const el=document.getElementById('svcFilter'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
    }
    bind();
    syncStickyHeights();
    revealNew();
  }

  function handleAction(action, key){
    if (action === 'add-service'){
      const id = prompt('מזהה באנגלית לשירות החדש (למשל gym2):');
      if (!id) return;
      if (data.services[id]) return alert('מזהה כבר קיים');
      svcFilter = '';
      focusNew = ()=> {
        const btn = Array.from(panesEl.querySelectorAll('[data-action="del-service"]')).find(b=>b.dataset.key===id);
        return btn ? btn.closest('.admin-card') : null;
      };
      data.services[id] = { name:'שירות חדש', category:'logistics', icon:'⭐',
        hours:{'0':'','1':'','2':'','3':'','4':'','5':'','6':''},
        note:'', videoUrl:'', videoCaption:'', waGroupUrl:'', waGroupLabel:'' };
    }
    else if (action === 'del-service'){ if(confirm('למחוק את השירות?')) delete data.services[key]; else return; }
    else if (action === 'add-phone'){ data.phones.push({name:'',role:'',number:''}); focusNew = lastCardOfActivePane; }
    else if (action === 'del-phone'){ if(confirm('למחוק?')) data.phones.splice(+key,1); else return; }
    else if (action === 'add-route'){ data.busRoutes.push({id:data.busRoutes.length+1, name:'מסלול חדש', minuteOffset:0, stops:''}); focusNew = lastCardOfActivePane; }
    else if (action === 'del-route'){ if(confirm('למחוק מסלול?')) data.busRoutes.splice(+key,1); else return; }
    else if (action === 'add-body'){ data.transportInfo.body.push(''); focusNew = ()=>{ const pane=document.getElementById('pane-transport'); const t=pane?pane.querySelectorAll('textarea'):[]; return t.length?t[t.length-1]:null; }; }
    else if (action === 'del-body'){ data.transportInfo.body.splice(+key,1); }
    else if (action === 'add-shuttle'){ data.shuttles.push({route:'',days:'',whatsapp:''}); focusNew = lastCardOfActivePane; }
    else if (action === 'del-shuttle'){ if(confirm('למחוק שאטל?')) data.shuttles.splice(+key,1); else return; }
    else if (action === 'add-guideline'){ data.guidelines.push({title:'נושא חדש', points:['']}); focusNew = lastCardOfActivePane; }
    else if (action === 'del-guideline'){ if(confirm('למחוק נושא?')) data.guidelines.splice(+key,1); else return; }
    else if (action === 'add-point'){ data.guidelines[+key].points.push(''); const gi=+key; focusNew = ()=>{ const pane=document.getElementById('pane-guidelines'); const cards=pane?pane.querySelectorAll('.admin-card'):[]; const c=cards[gi]; if(!c) return null; const ins=c.querySelectorAll('input,textarea'); return ins.length?ins[ins.length-1]:c; }; }
    else if (action === 'del-point'){ const [g,p]=key.split(':'); data.guidelines[+g].points.splice(+p,1); }
    else if (action === 'add-step'){ data.absorptionSteps.push({title:'שלב חדש', desc:''}); focusNew = lastCardOfActivePane; }
    else if (action === 'del-step'){ if(confirm('למחוק שלב?')) data.absorptionSteps.splice(+key,1); else return; }
    markDirty();
    renderAll();
  }

  // ---------- מסכי עריכה ----------
  function renderServices(){
    let html = '<p class="admin-hint">שעות: כתבו "08:00-12:00", מספר טווחים מופרדים בפסיק, ואפשר תווית בסוגריים. שדה ריק = סגור.</p>';
    html += '<input class="admin-filter" id="svcFilter" placeholder="🔎 סינון לפי שם שירות או קטגוריה..." value="'+esc(svcFilter)+'">';
    html += '<button class="admin-btn small" data-action="add-service">+ הוספת שירות</button><div style="height:10px"></div>';
    const f = svcFilter.trim();
    const keys = Object.keys(data.services).filter(k=>{
      if(!f) return true;
      const s = data.services[k];
      return (s.name||'').includes(f) || k.includes(f) || (CAT_LABELS[s.category]||'').includes(f);
    });
    if(!keys.length) html += '<p class="admin-hint">לא נמצאו שירותים תואמים.</p>';
    // מקובצים לפי קטגוריה כדי שיהיה קל למצוא
    const byCat = {};
    keys.forEach(k=>{ const c=data.services[k].category||'אחר'; (byCat[c]=byCat[c]||[]).push(k); });
    const order = CATS.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CATS.includes(c)));
    const ordered = [];
    order.forEach(c=>{ ordered.push({head:CAT_LABELS[c]||c, count:byCat[c].length}); byCat[c].forEach(k=>ordered.push({key:k})); });
    ordered.forEach(item=>{
      if(item.head){ html += '<div class="admin-cat-head">'+esc(item.head)+' <span style="font-weight:400;color:#888;font-size:12px">('+item.count+')</span></div>'; return; }
      const key = item.key;
      const s = data.services[key];
      html += '<div class="admin-card"><div class="admin-card-head"><h4>'+esc(s.name||key)+' <span style="font-weight:400;font-size:12px;color:#888">('+esc(key)+')</span></h4>'+
        '<button class="admin-btn danger small" data-action="del-service" data-key="'+esc(key)+'">מחיקה</button></div>';
      html += '<div class="admin-row">'
        + field('שם', s.name, 'services|'+key+'|name')
        + field('קטגוריה', s.category, 'services|'+key+'|category', {type:'select', options:CATS, labels:CAT_LABELS})
        + field('אייקון', s.icon, 'services|'+key+'|icon')
        + '</div>';
      html += '<div class="admin-row">';
      for (let d=0; d<7; d++) html += field(DAYS[d], (s.hours&&s.hours[d])||'', 'services|'+key+'|hours|'+d);
      html += '</div>';
      html += '<div class="admin-row">' + field('הערה (תומך HTML)', s.note||'', 'services|'+key+'|note', {type:'textarea', wide:true}) + '</div>';
      html += '<div class="admin-row">'
        + field('קישור/שם סרטון', s.videoUrl||'', 'services|'+key+'|videoUrl')
        + field('כיתוב לסרטון', s.videoCaption||'', 'services|'+key+'|videoCaption')
        + '</div><div class="admin-row">'
        + field('קישור קבוצת וואטסאפ', s.waGroupUrl||'', 'services|'+key+'|waGroupUrl')
        + field('תווית הקבוצה', s.waGroupLabel||'', 'services|'+key+'|waGroupLabel')
        + '</div></div>';
    });
    return html;
  }

  function renderPhones(){
    let html = '<button class="admin-btn small" data-action="add-phone">+ הוספת טלפון</button><div style="height:10px"></div>';
    data.phones.forEach((p,i)=>{
      html += '<div class="admin-card"><div class="admin-row">'
        + field('שם', p.name, 'phones|'+i+'|name')
        + field('תיאור', p.role, 'phones|'+i+'|role')
        + field('מספר', p.number, 'phones|'+i+'|number')
        + '</div><button class="admin-btn danger small" data-action="del-phone" data-key="'+i+'">מחיקה</button></div>';
    });
    return html;
  }

  function renderBus(){
    let html = '<div class="admin-card"><h4>שעות פעילות קו 10</h4><div class="admin-row">'
      + field('שעה ראשונה', data.busHours.firstHour, 'busHours|firstHour', {type:'number'})
      + field('שעה אחרונה (ימי חול)', data.busHours.lastHourNormal, 'busHours|lastHourNormal', {type:'number'})
      + field('שעה אחרונה (יום חמישי)', data.busHours.lastHourThursday, 'busHours|lastHourThursday', {type:'number'})
      + '</div></div>';
    html += '<p class="admin-hint">תחנות מופרדות בחץ " ← ". דקת יציאה = הדקה בכל שעה עגולה.</p>';
    html += '<button class="admin-btn small" data-action="add-route">+ הוספת מסלול</button><div style="height:10px"></div>';
    data.busRoutes.forEach((r,i)=>{
      html += '<div class="admin-card"><div class="admin-row">'
        + field('שם המסלול', r.name, 'busRoutes|'+i+'|name')
        + field('מזהה', r.id, 'busRoutes|'+i+'|id', {type:'number'})
        + field('דקת יציאה', r.minuteOffset, 'busRoutes|'+i+'|minuteOffset', {type:'number'})
        + '</div><div class="admin-row">'
        + field('תחנות', r.stops, 'busRoutes|'+i+'|stops', {type:'textarea', wide:true})
        + '</div><button class="admin-btn danger small" data-action="del-route" data-key="'+i+'">מחיקה</button></div>';
    });
    return html;
  }

  function renderTransport(){
    const t = data.transportInfo;
    let html = '<div class="admin-card"><div class="admin-row">'
      + field('כותרת', t.title, 'transportInfo|title', {wide:true})
      + '</div>';
    t.body.forEach((b,i)=>{
      html += '<div class="admin-row">' + field('פסקה '+(i+1), b, 'transportInfo|body|'+i, {type:'textarea', wide:true}) + '</div>'
        + '<button class="admin-btn danger small" data-action="del-body" data-key="'+i+'">מחיקת פסקה</button><div style="height:8px"></div>';
    });
    html += '<button class="admin-btn small" data-action="add-body">+ הוספת פסקה</button>';
    html += '<div class="admin-row" style="margin-top:10px">'
      + field('קישור/שם סרטון', t.videoUrl||'', 'transportInfo|videoUrl')
      + field('כיתוב לסרטון', t.videoCaption||'', 'transportInfo|videoCaption')
      + '</div><div class="admin-row">'
      + field('תווית הקישור', t.linkLabel||'', 'transportInfo|linkLabel')
      + field('כתובת הקישור', t.linkUrl||'', 'transportInfo|linkUrl')
      + '</div></div>';
    return html;
  }

  function renderShuttles(){
    let html = '<div class="admin-card"><h4>אפליקציית השאטל</h4><div class="admin-row">'
      + field('App Store', data.shuttleApps.appStoreUrl||'', 'shuttleApps|appStoreUrl')
      + field('Google Play', data.shuttleApps.googlePlayUrl||'', 'shuttleApps|googlePlayUrl')
      + '</div></div>';
    html += '<button class="admin-btn small" data-action="add-shuttle">+ הוספת שאטל</button><div style="height:10px"></div>';
    data.shuttles.forEach((s,i)=>{
      html += '<div class="admin-card"><div class="admin-row">'
        + field('מסלול', s.route, 'shuttles|'+i+'|route')
        + field('ימים', s.days, 'shuttles|'+i+'|days')
        + field('קישור וואטסאפ', s.whatsapp, 'shuttles|'+i+'|whatsapp')
        + '</div><button class="admin-btn danger small" data-action="del-shuttle" data-key="'+i+'">מחיקה</button></div>';
    });
    return html;
  }

  function renderGuidelines(){
    let html = '<button class="admin-btn small" data-action="add-guideline">+ הוספת נושא</button><div style="height:10px"></div>';
    data.guidelines.forEach((g,i)=>{
      html += '<div class="admin-card"><div class="admin-row">'
        + field('כותרת הנושא', g.title, 'guidelines|'+i+'|title', {wide:true}) + '</div>';
      g.points.forEach((p,j)=>{
        html += '<div class="admin-row" style="align-items:flex-end">'
          + field('נקודה '+(j+1), p, 'guidelines|'+i+'|points|'+j, {type:'textarea'})
          + '<button class="admin-btn danger small" data-action="del-point" data-key="'+i+':'+j+'">מחיקה</button></div>';
      });
      html += '<button class="admin-btn ghost small" data-action="add-point" data-key="'+i+'">+ נקודה</button> '
        + '<button class="admin-btn danger small" data-action="del-guideline" data-key="'+i+'">מחיקת הנושא</button></div>';
    });
    return html;
  }

  function renderSteps(){
    let html = '<button class="admin-btn small" data-action="add-step">+ הוספת שלב</button><div style="height:10px"></div>';
    data.absorptionSteps.forEach((s,i)=>{
      html += '<div class="admin-card"><div class="admin-row">'
        + field('כותרת השלב', s.title, 'absorptionSteps|'+i+'|title', {wide:true})
        + '</div><div class="admin-row">'
        + field('תיאור (תומך HTML)', s.desc, 'absorptionSteps|'+i+'|desc', {type:'textarea', wide:true})
        + '</div><button class="admin-btn danger small" data-action="del-step" data-key="'+i+'">מחיקה</button></div>';
    });
    return html;
  }

  // ---------- שמירה ----------
  const saveBtn = document.getElementById('adminSave');
  saveBtn.addEventListener('click', async ()=>{
    if (!data) return;
    saveBtn.disabled = true;
    saveMsg.className = 'admin-status';
    saveMsg.textContent = 'שומר ומפרסם...';
    try{
      const res = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'save', password, data })
      });
      const out = await res.json().catch(()=>({}));
      if (!res.ok || !out.ok) throw new Error(out.error || 'השמירה נכשלה');
      saveMsg.className = 'admin-status ok';
      saveMsg.textContent = '✔ נשמר בהצלחה! הפרסום לכלל המשתמשים יסתיים תוך כדקה.';
      markClean();
    }catch(e){
      saveMsg.className = 'admin-status err';
      saveMsg.textContent = '✖ ' + (e.message || 'שגיאה בשמירה');
    }finally{
      saveBtn.disabled = false;
    }
  });
  // Ctrl/Cmd+S = שמירה מהירה, Esc = סגירה
  document.addEventListener('keydown', e=>{
    if(!overlay.classList.contains('open')) return;
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); if(!saveBtn.disabled && data) saveBtn.click(); }
    if(e.key==='Escape' && !dirty) close();
  });
})();
</script>
