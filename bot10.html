<script>
(function(){
  const CATEGORIES = {
    health:{label:'בריאות',icon:'⚕'},
    food:{label:'אוכל',icon:'🍽'},
    logistics:{label:'לוגיסטיקה',icon:'🧰'},
    manpower:{label:'כוח אדם',icon:'👥'},
    sport:{label:'ספורט',icon:'🏋'},
    prayers:{label:'תפילות',icon:'🕍'},
    transport:{label:'תחבורה',icon:'🚌'}
  };
  const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

  let DATA = null;
  const fab = document.getElementById('chatbot-fab');
  const panel = document.getElementById('chatbot-panel');
  const closeBtn = document.getElementById('chatbot-close');
  const msgs = document.getElementById('chatbot-messages');
  const input = document.getElementById('chatbot-input');
  const sendBtn = document.getElementById('chatbot-send');

  async function loadData(){
    try{
      const res = await fetch('data.json?_=' + Date.now());
      DATA = await res.json();
    }catch(e){ console.error('Bot: data load failed',e); }
  }

  function addMsg(html, who){
    const d = document.createElement('div');
    d.className = 'cb-msg ' + (who || 'bot');
    d.innerHTML = html;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function addChips(items){
    const wrap = document.createElement('div');
    wrap.className = 'cb-chips';
    items.forEach(it=>{
      const b = document.createElement('button');
      b.className = 'cb-chip' + (it.back?' back':'');
      b.textContent = it.label;
      b.onclick = ()=>{ it.action(); };
      wrap.appendChild(b);
    });
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // ─── Helpers ───

  function parseRanges(str){
    if(!str||!str.trim()) return [];
    return str.split(',').map(s=>s.trim()).filter(Boolean).map(seg=>{
      const label = (seg.match(/\(([^)]+)\)/)||[])[1] || '';
      const clean = seg.replace(/\([^)]*\)/,'').trim();
      const m = clean.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if(!m) return null;
      return {startMin:+m[1]*60+ +m[2], endMin:+m[3]*60+ +m[4], text:clean, label};
    }).filter(Boolean);
  }

  function isOpenNow(hoursObj){
    const now = new Date();
    const day = now.getDay();
    const minutes = now.getHours()*60 + now.getMinutes();
    const ranges = parseRanges(hoursObj[day]||'');
    return ranges.some(r=>minutes>=r.startMin && minutes<r.endMin);
  }

  function fmtHours(hoursObj){
    return DAYS.map((d,i)=>{
      const raw = hoursObj[i]||'';
      return `<div style="display:flex;gap:8px;padding:2px 0"><span style="min-width:52px;font-weight:600;color:#6B4C7A">${d}:</span><span>${raw||'סגור'}</span></div>`;
    }).join('');
  }

  function minutesNow(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
  function fmtMin(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

  // ─── Text normalization & fuzzy matching ───

  function norm(str){
    return String(str==null?'':str)
      .toLowerCase()
      .replace(/[֑-ׇ]/g,'')
      .replace(/["'`׳״]/g,'')
      .replace(/[.,!?;:()\-–—]/g,' ')
      .replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ')
      .replace(/\s+/g,' ').trim();
  }

  function stripPrefix(w){
    if(w.length>3 && /^[הבלושכמ]/.test(w)) return w.slice(1);
    return w;
  }

  function stripAllPrefixes(w){
    let out = w;
    for(let i=0; i<3 && out.length>2; i++){
      const next = stripPrefix(out);
      if(next === out) break;
      out = next;
    }
    return out;
  }

  function tokens(t){
    const out = [];
    norm(t).split(' ').filter(Boolean).forEach(w=>{
      out.push(w);
      const b = stripPrefix(w);
      if(b!==w) out.push(b);
      const c = stripAllPrefixes(w);
      if(c!==w && c!==b) out.push(c);
    });
    return out;
  }

  function lev(a,b){
    if(Math.abs(a.length-b.length)>2) return 9;
    const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
    for(let i=1;i<=m;i++){
      const cur=[i];
      for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      prev=cur;
    }
    return prev[n];
  }

  function kwMatch(text, kw){
    const t = norm(text), k = norm(kw);
    if(!k) return false;
    if(t.includes(k)) return true;
    if(k.includes(' ')){
      const parts = k.split(' ');
      if(parts.every(p => t.includes(p))) return true;
      return false;
    }
    if(k.length < 3) return t.split(' ').includes(k);
    const tol = k.length >= 6 ? 2 : 1;
    return tokens(t).some(w => lev(w,k) <= tol || lev(stripAllPrefixes(w),k) <= tol);
  }

  // כמו kwMatch, אבל מחזיר ציון (0 = התאמה מדויקת, גבוה יותר = פחות טוב, Infinity = אין התאמה כלל) -
  // כדי לאפשר להשוות בין כמה מועמדים ולבחור את הכי טוב, במקום לעצור על ההתאמה המטושטשת הראשונה שנמצאת.
  // זה קריטי כשיש כמה שירותים/מילות מפתח: בלי ציון, "בריכה" יכול "להיתפס" בטעות על ידי "בשרייה"
  // (מרחק עריכה קטן ביניהן) רק כי בשרייה מופיעה קודם ברשימת השירותים, למרות ש"בריכה" תואמת בדיוק לשירות אחר.
  function kwMatchScore(text, kw){
    const t = norm(text), k = norm(kw);
    if(!k) return Infinity;
    if(t.includes(k)) return 0;
    if(k.includes(' ')){
      const parts = k.split(' ');
      return parts.every(p => t.includes(p)) ? 0.5 : Infinity;
    }
    if(k.length < 3) return t.split(' ').includes(k) ? 0 : Infinity;
    const tol = k.length >= 6 ? 2 : 1;
    let best = Infinity;
    tokens(t).forEach(w=>{
      best = Math.min(best, lev(w,k), lev(stripAllPrefixes(w),k));
    });
    return best <= tol ? best + 1 : Infinity; // +1 כך שכל התאמה מטושטשת (אפילו עם מרחק 0) גרועה יותר מהתאמה מדויקת
  }

  // בודק אם אחת ממילות/ביטויי המפתח מופיעה בטקסט המנורמל. חשוב להשתמש בזה (ולא ב-regex גולמי)
  // לכל בדיקת מילת-מפתח בעברית, כי norm() ממיר אותיות סופיות (ך/ם/ן/ף/ץ) לצורתן הרגילה בטקסט
  // הנבדק - ומילת מפתח שנכתבת נכון עם אות סופית (למשל "טלפון", "שלום", "חירום") לעולם לא הייתה
  // תואמת לטקסט המנורמל אם משווים אותה ישירות ב-regex/includes בלי לעבור גם היא דרך norm().
  function hasAny(t, words){
    return words.some(w => t.includes(norm(w)));
  }
  // כמו hasAny, אך דורש התאמה מדויקת לכל הטקסט (לא רק תת-מחרוזת) - לברכות כמו "שלום"/"היי" בלבד
  function isExact(t, words){
    return words.some(w => t === norm(w));
  }

  // ─── Service finding with expanded aliases ───

  const SERVICE_ALIASES = {
    'מרפאה':'clinic','חובש':'clinic','חובשת':'clinic','זריקה':'clinic','חיסון':'clinic',
    'תור רופא':'clinic','רופא':'clinic','מסדר חולים':'clinic','חולה':'clinic','חולים':'clinic',
    'מדיטיק':'clinic','meditik':'clinic','דלפק קבלה':'clinic','כאב בטן':'clinic','חום':'clinic',
    'לא מרגיש טוב':'clinic','חולשה':'clinic','מרגיש רע':'clinic','תרופה':'clinic','תרופות':'clinic',
    'שיניים':'dental','שן':'dental','כאב שיניים':'dental','רופא שיניים':'dental','דנטלי':'dental',
    'סתימה':'dental','עקירה':'dental','חניכיים':'dental',
    'פסיכולוג':'mental-health','פסיכולוגית':'mental-health','בריאות הנפש':'mental-health',
    'נפשי':'mental-health','טיפול רגשי':'mental-health','ייעוץ':'mental-health','קצין בריאות הנפש':'mental-health',
    'קשה לי':'mental-health','לחץ':'mental-health','חרדה':'mental-health','דיכאון':'mental-health','מישהו לדבר איתו':'mental-health',
    'כושר':'gym','חדר כושר':'gym','אימון':'gym','משקולות':'gym','להתאמן':'gym','חדרכושר':'gym',
    'ריצה':'gym','מכשירי כושר':'gym','ג׳ים':'gym','ג\'ים':'gym',
    'בריכה':'pool','לשחות':'pool','שחייה':'pool','בגד ים':'pool',
    'חדר אוכל':'mess-hall','חדראוכל':'mess-hall','קפיטריה':'mess-hall','ארוחה':'mess-hall',
    'ארוחת בוקר':'mess-hall','ארוחת צהריים':'mess-hall','ארוחת ערב':'mess-hall',
    'לאכול':'mess-hall','רעב':'mess-hall','אוכל':'mess-hall','חדר אוכל מרכזי':'mess-hall',
    'בשריה':'meat-kitchen','בשרייה':'meat-kitchen','סטייק':'meat-kitchen','ארוחה בשרית':'meat-kitchen',
    'חלביה':'dairy-kitchen','חלבייה':'dairy-kitchen','ארוחה חלבית':'dairy-kitchen','גבינה':'dairy-kitchen',
    'שקם':'shekem','קיוסק':'shekem','חנות':'shekem','חטיף':'shekem','לקנות':'shekem','שק"מ':'shekem',
    'חטיפים':'shekem','ממתקים':'shekem','שתייה':'shekem','קניות':'shekem','לקניות':'shekem',
    'משרד רישום':'adjutancy','רישום':'adjutancy','שלישות':'adjutancy','כוח אדם':'adjutancy',
    'רישום בסיסי':'adjutancy','אבנט':'adjutancy','תעודת חוגר':'adjutancy','אישור':'adjutancy',
    'אישורים':'adjutancy','תלוש':'adjutancy','משכורת':'adjutancy','חופשה':'adjutancy','ימי מחלה':'adjutancy',
    'מילואים':'reserves','מילי':'reserves','משרת מילואים':'reserves','משרתת מילואים':'reserves',
    'זכויות מילואים':'reserves','הטבות מילואים':'reserves','זכויות והטבות':'reserves','בוט מילי':'reserves',
    'אפסנאות':'quartermaster','ציוד':'quartermaster','מדים':'quartermaster',
    'ציוד אישי':'quartermaster','ביגוד':'quartermaster','נעליים':'quartermaster',
    'נשקייה':'armory','נשק':'armory','טופס נשק':'armory','אקדח':'armory','רובה':'armory',
    'להחזיר נשק':'armory','להוציא נשק':'armory','תחמושת':'armory',
    'בית כנסת':'synagogue','בית הכנסת':'synagogue','תפילה':'synagogue','תפילות':'synagogue',
    'חג':'synagogue','שחרית':'synagogue','מנחה':'synagogue','ערבית':'synagogue',
    'שבת':'synagogue','קבלת שבת':'synagogue','הבדלה':'synagogue','רב':'synagogue','רבנות':'synagogue',
    'סידור':'synagogue','טלית':'synagogue','תפילין':'synagogue','כיפור':'synagogue','סוכות':'synagogue',
    'פסח':'synagogue','שבועות':'synagogue','ראש השנה':'synagogue','מגילה':'synagogue','חנוכה':'synagogue',
    'פורים':'synagogue','ט"ו בשבט':'synagogue','יום כיפור':'synagogue'
  };

  function findService(text){
    const t = norm(text);
    let best = null, bestScore = Infinity;
    for(const [k,s] of Object.entries(DATA.services)){
      const score = Math.min(kwMatchScore(t, s.name), kwMatchScore(t, k));
      if(score < bestScore){ bestScore = score; best = [k,s]; }
    }
    for(const [a,k] of Object.entries(SERVICE_ALIASES)){
      if(!DATA.services[k]) continue;
      const score = kwMatchScore(t, a);
      if(score < bestScore){ bestScore = score; best = [k, DATA.services[k]]; }
    }
    return bestScore === Infinity ? null : best;
  }

  function suggestServices(text){
    const t = tokens(text);
    const scored = Object.entries(DATA.services).map(([k,s])=>{
      let best = 9;
      norm(s.name).split(' ').forEach(nw=>{
        t.forEach(w=>{
          if(w.length>2&&nw.length>2) best=Math.min(best,lev(w,nw));
        });
      });
      return {k,s,best};
    }).filter(x=>x.best<=2).sort((a,b)=>a.best-b.best).slice(0,4);
    return scored;
  }

  // ─── Time & day helpers ───

  function nextChange(s){
    const now = minutesNow(), day = new Date().getDay();
    const today = parseRanges(s.hours[day]||'');
    const cur = today.find(r=>now>=r.startMin && now<r.endMin);
    if(cur) return {open:true, closesAt:cur.endMin, text:'נסגר היום ב-<b>'+fmtMin(cur.endMin)+'</b>', label:cur.label};
    const later = today.filter(r=>r.startMin>now).sort((a,b)=>a.startMin-b.startMin)[0];
    if(later) return {open:false, opensAt:later.startMin, text:'ייפתח היום ב-<b>'+fmtMin(later.startMin)+'</b>', label:later.label};
    for(let i=1;i<=7;i++){
      const d=(day+i)%7, ranges=parseRanges(s.hours[d]||'');
      const r = ranges.sort((a,b)=>a.startMin-b.startMin)[0];
      if(r) return {open:false, opensAt:r.startMin, dayIndex:d, text:'ייפתח ביום <b>'+DAYS[d]+'</b> ב-'+fmtMin(r.startMin)};
    }
    return {open:false, text:'אין שעות פעילות ידועות'};
  }

  function dayInText(text){
    // שימוש ב-\b לא עובד כאן בכוונה - גבולות מילה ב-JS מוגדרים לפי \w (אותיות לטיניות בלבד),
    // ואותיות עבריות לא נחשבות \w, כך שההשוואה מעולם לא הצליחה לזהות "מחר"/"היום" בטקסט עברי.
    // הפתרון: מרפדים ברווחים ובודקים כתת-מחרוזת שלמה בין רווחים - וגם מנרמלים את מילות ההשוואה עצמן
    // (norm), כי גם הן עלולות להסתיים באות סופית (כמו "מחרתיים" שמסתיים ב-ם).
    const t = ' ' + norm(text) + ' ';
    if(t.includes(' '+norm('מחרתיים')+' ')) return (new Date().getDay()+2)%7;
    if(t.includes(' '+norm('מחר')+' ')) return (new Date().getDay()+1)%7;
    if(t.includes(' '+norm('היום')+' ')) return new Date().getDay();
    const i = DAYS.findIndex(d=>t.includes(norm(d)));
    return i>=0 ? i : null;
  }

  function extractTime(text){
    const m = text.match(/(\d{1,2}):(\d{2})/) || text.match(/ב[־\-\s]*(\d{1,2})(?![\d:])/);
    if(!m) return null;
    const h = +m[1]; const mm = m[2]?+m[2]:0;
    if(h>=0&&h<=23&&mm>=0&&mm<=59) return h*60+mm;
    return null;
  }

  // ─── Display functions ───

  function showOpenNow(){
    const now = minutesNow();
    const open = Object.entries(DATA.services).filter(([,s])=>isOpenNow(s.hours));
    const closed = Object.entries(DATA.services).filter(([,s])=>!isOpenNow(s.hours));
    if(!open.length){
      addMsg('<b>🔴 כרגע אין שירות פתוח.</b>');
    } else {
      let html = '<b>🟢 פתוח כרגע ('+fmtMin(now)+'):</b><div style="margin-top:6px;font-size:13px">';
      open.forEach(([k,s])=>{
        const c = nextChange(s);
        html += `<div style="padding:4px 0;border-bottom:1px dashed #EED2B8">${s.icon} <b>${s.name}</b> — ${c.text}</div>`;
      });
      html += '</div>';
      addMsg(html);
    }
    const upcoming = closed.map(([k,s])=>{
      const c = nextChange(s);
      return {k,s,c};
    }).filter(x=>!x.c.open && x.c.text.includes('היום')).slice(0,3);
    if(upcoming.length){
      let html = '<b>⏳ ייפתח בהמשך היום:</b><div style="margin-top:4px;font-size:13px">';
      upcoming.forEach(({s,c})=>{
        html += `<div style="padding:3px 0">${s.icon} <b>${s.name}</b> — ${c.text}</div>`;
      });
      html += '</div>';
      addMsg(html);
    }
    addChips([{label:'🏠 תפריט ראשי',back:true,action:greet}]);
  }

  function showCategory(cat){
    if(cat === 'transport'){
      // לקטגוריית תחבורה אין "שירותים" ברשימת DATA.services בכלל - קו 10, שאטלים ומידע 392
      // חיים במבנים נפרדים. לכן מציגים תפריט ייעודי במקום לנסות (ולהיכשל) לרשום שירותים.
      addMsg('<b>🚌 תחבורה</b><br>איזה מידע תרצו?');
      const chips = [
        {label:'🚌 קו 10 (הסעות פנימיות)',action:showBusMenu},
        {label:'🚐 שאטלים לערים',action:showShuttles},
      ];
      if(DATA.transportInfo) chips.push({label:'🚍 תחבורה ציבורית (קו 392)',action:showTransportInfo});
      chips.push({label:'↩ לקטגוריות',back:true,action:showCategories});
      addChips(chips);
      return;
    }
    const svcs = Object.entries(DATA.services).filter(([,s])=>s.category===cat);
    if(!svcs.length){ addMsg('אין שירותים בקטגוריה זו.'); return; }
    addMsg('שירותים בקטגוריית <b>'+CATEGORIES[cat].label+'</b>:');
    const chips = svcs.map(([k,s])=>({
      label: s.icon+' '+s.name+(isInfoOnlyService(s) ? '' : (isOpenNow(s.hours)?' 🟢':' 🔴')),
      action: ()=>showService(k)
    }));
    chips.push({label:'↩ לקטגוריות',back:true,action:showCategories});
    addChips(chips);
  }

  function isInfoOnlyService(s){
    // כרטיס "מידע בלבד" בלי שעות פעילות בכלל (למשל הפניה למשאב חיצוני שזמין תמיד) -
    // לא מציגים חותמת פתוח/סגור וטבלת שעות מיותרת, רק את ההערה והקישורים.
    return Object.values(s.hours||{}).every(h => !h || !String(h).trim());
  }

  function showService(key){
    const s = DATA.services[key]; if(!s) return;
    let html;
    if (isInfoOnlyService(s)){
      html = `<b>${s.icon} ${s.name}</b>`;
    } else {
      const open = isOpenNow(s.hours);
      const today = DAYS[new Date().getDay()];
      const todayHours = s.hours[new Date().getDay()] || 'סגור';
      const change = nextChange(s);
      html = `<b>${s.icon} ${s.name}</b> <span class="cb-status ${open?'open':'closed'}">${open?'פתוח כעת':'סגור כעת'}</span>`;
      html += `<div style="margin-top:4px;font-size:13px;color:#6B4C7A">${change.text}</div>`;
      html += `<div style="margin-top:6px"><b>היום (${today}):</b> ${todayHours||'סגור'}</div>`;
      html += `<div style="margin-top:8px;padding-top:6px;border-top:1px dashed #EED2B8"><b>שעות שבועיות:</b><div style="font-size:13px;margin-top:4px">${fmtHours(s.hours)}</div></div>`;
    }
    if(s.note) html += `<div style="margin-top:8px;padding:6px 8px;background:#FBF3E7;border-radius:8px;font-size:13px">💡 ${s.note}</div>`;
    if(s.videoUrl) html += `<div style="margin-top:6px;font-size:13px">🎬 <a href="${s.videoUrl}" style="color:#D9603D;font-weight:600">צפו בסרטון הדרכה</a> — ${s.videoCaption||''}</div>`;
    if(s.waGroupUrl) html += `<div style="margin-top:4px;font-size:13px">📱 <a href="${s.waGroupUrl}" target="_blank" style="color:#D9603D;font-weight:600">${s.waGroupLabel||'קבוצת וואטסאפ'}</a></div>`;
    addMsg(html);
    addChips([
      {label:'↩ לקטגוריה',back:true,action:()=>showCategory(s.category)},
      {label:'🏠 תפריט ראשי',back:true,action:greet}
    ]);
  }

  function answerPhone(text){
    const t = norm(text);
    const phoneKeywords = ['טלפון','מספר','התקשר','להתקשר','לחייג','חייג','טל','פלאפון','נייד','לצלצל','ליצור קשר','יצירת קשר'];
    const hasKeyword = phoneKeywords.some(kw=>kwMatch(t,kw));
    if(!hasKeyword) return false;

    const results = DATA.phones.filter(p=>{
      return kwMatch(t, p.name) || kwMatch(t, p.role);
    });

    if(results.length){
      let html = '<b>📞 מצאתי:</b><div style="margin-top:4px;font-size:13px">';
      results.forEach(p=>{
        html += `<div style="padding:6px 0;border-bottom:1px dashed #EED2B8"><b>${p.name}</b> — ${p.role}<br><a href="tel:${p.number.replace(/[^0-9+]/g,'')}" style="color:#D9603D;font-weight:700;font-size:15px">📞 ${p.number}</a></div>`;
      });
      html += '</div>';
      addMsg(html);
    } else {
      showPhones();
    }
    return true;
  }

  function answerPhoneByServiceName(text){
    const t = norm(text);
    const phoneKeywords = ['טלפון','מספר','התקשר','להתקשר','לחייג','ליצור קשר','יצירת קשר'];
    if(!phoneKeywords.some(kw=>kwMatch(t,kw))) return false;
    const svc = findService(text);
    if(!svc) return false;
    const [key, s] = svc;
    const phoneName = norm(s.name);
    const match = DATA.phones.filter(p=>kwMatch(norm(p.name), phoneName) || kwMatch(phoneName, norm(p.name)));
    if(match.length){
      let html = `<b>📞 ${s.name}:</b><div style="margin-top:4px;font-size:13px">`;
      match.forEach(p=>{
        html += `<div style="padding:4px 0"><b>${p.name}</b> — ${p.role}<br><a href="tel:${p.number.replace(/[^0-9+]/g,'')}" style="color:#D9603D;font-weight:700">📞 ${p.number}</a></div>`;
      });
      html += '</div>';
      addMsg(html);
      return true;
    }
    return false;
  }

  function shuttleCities(){
    const set = new Set();
    (DATA.shuttles||[]).forEach(s=>{
      s.route.split(/[←,\/]|->/).forEach(part=>{
        const c = part.trim();
        if(c.length>=2) set.add(c);
      });
    });
    return [...set];
  }

  function answerShuttle(text){
    const t = norm(text);
    const hasKeyword = hasAny(t, ['שאטל','הסעה','הסעות','הביתה','בייתה','לבית']);
    const cities = shuttleCities();
    const matchedCities = cities.filter(c=>kwMatch(t,c));
    if(!hasKeyword && !matchedCities.length) return false;

    const dayMatch = DAYS.find(d=>t.includes(norm(d)));
    let list = DATA.shuttles;
    if(matchedCities.length) list = list.filter(s=>matchedCities.some(c=>s.route.includes(c)));
    if(dayMatch) list = list.filter(s=>s.days.includes(dayMatch));

    if(!list.length){
      addMsg('<b>🚐 שאטלים</b><br>לא מצאתי שאטל מתאים. הנה כל השאטלים הזמינים:');
      showShuttles();
      return true;
    }

    let html = '<b>🚐 שאטלים' + (matchedCities.length ? ' — '+matchedCities.join(', ') : '') + ':</b><div style="margin-top:4px;font-size:13px">';
    list.forEach(s=>{

  function findBusRoutesForStop(stopText){
    const t = norm(stopText);
    return DATA.busRoutes.filter(r=>{
      return r.stops.split('←').some(s=>kwMatch(norm(s.trim()),t));
    }).map(r=>{
      const stops = r.stops.split('←').map(s=>s.trim());
      const idx = stops.findIndex(s=>kwMatch(norm(s),t));
      return {route:r, stopIndex:idx, totalStops:stops.length, stopName:stops[idx]};
    });
  }

  function answerBusQuestion(text){
    const t = norm(text);
    const allStops = new Set();
    DATA.busRoutes.forEach(r=>{
      r.stops.split('←').forEach(s=>{ const trimmed = s.trim(); if(trimmed) allStops.add(trimmed); });
    });
    let dest = null;
    for(const stop of allStops){
      if(kwMatch(t, stop)){ dest = stop; break; }
    }
    if(!dest && hasAny(t, ['קו 10','אוטובוס פנימי','הסעה פנימית'])){
      showBusMenu();
      return true;
    }
    if(!dest) return false;

    const targetMin = extractTime(text);
    const matches = findBusRoutesForStop(dest);
    if(!matches.length){ addMsg('לא מצאתי מסלול פנימי שעובר ב-'+dest); return true; }

    const bh = DATA.busHours;
    const isThursday = new Date().getDay()===4;
    const lastHour = isThursday ? bh.lastHourThursday : bh.lastHourNormal;
    const nowMin = minutesNow();

    let html = `<b>🚌 יעד: ${dest}</b><br>`;
    matches.forEach(m=>{
      const deps = [];
      for(let h=bh.firstHour; h<=lastHour; h++){ deps.push(h*60 + m.route.minuteOffset); }

      let recommended = null;
      if(targetMin!=null){
        const valid = deps.filter(d=>d<=targetMin);
        recommended = valid.length ? valid[valid.length-1] : null;
      }
      const nextDep = deps.find(d=>d>nowMin);

      const depsHtml = deps.map(d=>{
        const hh = String(Math.floor(d/60)).padStart(2,'0'), mm = String(d%60).padStart(2,'0');
        let style = '';
        if(recommended!=null && d===recommended) style='font-weight:700;color:#2E7D32;background:#E8F5E9;padding:2px 6px;border-radius:4px';
        else if(d<nowMin) style='color:#999;text-decoration:line-through';
        else if(nextDep!=null && d===nextDep && targetMin==null) style='font-weight:700;color:#3B2A52';
        return `<span style="display:inline-block;margin:2px 6px 2px 0;${style}">${hh}:${mm}</span>`;
      }).join('');

      html += `<div style="padding:6px 0;border-bottom:1px dashed #EED2B8"><b>${m.route.name}</b> (תחנה ${m.stopIndex+1}/${m.totalStops})<br>${depsHtml}</div>`;
    });

    if(targetMin!=null){
      html += `<div style="margin-top:6px;padding:6px;background:#E8F5E9;border-radius:8px;font-size:13px">✅ המומלץ מודגש בירוק — האוטובוס האחרון שמגיע לפני ${fmtMin(targetMin)}</div>`;
    }
    addMsg(html);
    addChips([{label:'🏠 תפריט ראשי',back:true,action:greet}]);
    return true;
  }

           (t.length>3 && norm(point).includes(t))){

    // TRIGGERS ממופים לפי "רמז כותרת" (מילה/ביטוי שאמור להופיע בכותרת הנושא), לא לפי אינדקס קבוע -

      'ספיגה':'ספיגה', 'התרעה':'ספיגה', 'התראה':'ספיגה', 'התרעות':'ספיגה', 'התראות':'ספיגה',
      'מרחב מוגן':'ספיגה', 'ממ"ד':'ספיגה', 'ממד':'ספיגה', 'מקלט':'ספיגה', 'מקלטים':'ספיגה',

      'צבע אדום':'ספיגה', 'צבע אדום אדום':'ספיגה', 'אדום אדום':'ספיגה', 'התרעת צבע אדום':'ספיגה',
      'חדירה':'ספיגה', 'חדירת מחבלים':'ספיגה', 'פיצוץ':'ספיגה'
    };
    for(const [kw, topicHint] of Object.entries(TRIGGERS)){
      if(kwMatch(t, kw)){
        const idx = g.findIndex(topic => kwMatch(norm(topic.title), topicHint) || norm(topic.title).includes(norm(topicHint)));

  // ─── Main NLP engine ───

  function processQuestion(q){
    const text = q.trim();
    if(!text) return;
    addMsg(text,'user');
    if(!DATA){ addMsg('⏳ רגע, טוען נתונים...'); loadData().then(()=>processQuestion(q)); return; }

    const t = norm(text);

    // Greetings
    if(isExact(t, ['שלום','היי','הי','hello','hi','בוקר טוב','ערב טוב','לילה טוב','מה נשמע','מה קורה','אהלן'])){
      addMsg('שלום! 👋 במה אפשר לעזור?');
      greet();
      return;
    }

    // Thanks / menu / help
    if(isExact(t, ['תודה','תודה רבה','מרסי','thanks','thank you'])){
      addMsg('בשמחה! 😊 אם יש עוד שאלות — אני כאן.');
      addChips([{label:'🏠 תפריט ראשי',back:true,action:greet}]);
      return;
    }
    if(hasAny(t, ['תפריט','עזרה']) || t==='help'){ return greet(); }

    // Emergency — top priority
    if(answerEmergency(text)) return;

    // Phone requests — נבדק לפני שאלות תחבורה/קו 10, כי "טלפון של X" חייב לנצח התאמת שם תחנה
    // (למשל "טלפון של מושל"ם" לא אמור להיחטף על ידי מסלול קו 10 שעובר במושל"ם)
    if(hasAny(t, ['טלפון','מספר','התקשר','להתקשר','לחייג','חייג','פלאפון','נייד','לצלצל','ליצור קשר','יצירת קשר'])){
      if(answerPhoneByServiceName(text)) return;
      if(answerPhone(text)) return;
    }

    // "What's open now"
    if(hasAny(t, ['מה פתוח','מי פתוח','משהו פתוח'])) return showOpenNow();

    // "What's open on [day]"
    if(hasAny(t, ['מה פתוח','מי פתוח','משהו פתוח']) || (t.includes('פתוח') && dayInText(text)!==null && !findService(text))){
      if(answerOpenOnDay(text)) return;
    }

    // Booking appointments
    if(answerBookAppointment(text)) return;

    // Shuttles
    if(answerShuttle(text)) return;

    // Public transport (392, Egged)
    if(answerTransport(text)) return;

    // Internal bus
    if(answerBusQuestion(text)) return;
    if(hasAny(t, ['קו 10','אוטובוס פנימי','הסעה פנימית','רחבת היסעים'])){
      showBusMenu();
      return;
    }

    // Find specific service
    const svc = findService(text);

    // "Until when is X open?"
    if(svc && hasAny(t, ['עד מתי','עד כמה','עד איזה שעה'])){
      answerUntilWhen(text, svc);
      return;
    }

    // "When does X open?"
    if(svc && hasAny(t, ['מתי נפתח','מתי פותח','מתי יפתח','מתי ייפתח','מתי פתוח'])){
      const day = dayInText(text);
      if(day!==null){
        showServiceDay(svc[0], day);
      } else {
        answerWhenOpens(text, svc);
      }
      return;
    }

    // "Is X open?"
    if(svc && hasAny(t, ['פתוח','פתוחה','סגור','סגורה','עובד','עובדת','פועל','פועלת'])){
      const day = dayInText(text);
      if(day!==null){
        showServiceDay(svc[0], day);
      } else {
        answerIsOpen(text, svc);
      }
      return;
    }

    // "Hours of X on [day]"
    if(svc && dayInText(text)!==null){
      showServiceDay(svc[0], dayInText(text));
      return;
    }

    // "Hours of X" / just service name
    if(svc){
      const day = dayInText(text);
      if(day!==null){
        showServiceDay(svc[0], day);
      } else {
        showService(svc[0]);
      }
      return;
    }

    // WhatsApp groups
    if(answerWhatsApp(text)) return;

    // Videos
    if(answerVideo(text)) return;

    // "What is X?"
    if(answerWhatIs(text)) return;

    // Guidelines
    if(answerGuidelines(text)) return;

    // Absorption process
    if(answerAbsorption(text)) return;

    // "What's open on [day]?" without specific service
    if(answerOpenOnDay(text)) return;

    // Category keywords
    if(answerCategoryKeyword(text)) return;

    // General transport
    if(hasAny(t, ['תחבורה','לנסוע','נסיעה','אוטובוס','להגיע'])){
      showBusMenu();
      return;
    }

    // Fuzzy suggestions
    const guesses = suggestServices(text);
    if(guesses.length){
      addMsg('לא הצלחתי למצוא תשובה מדויקת. אולי התכוונתם לאחד מאלה?');
      addChips(guesses.map(g=>({label:g.s.icon+' '+g.s.name, action:()=>showService(g.k)}))
        .concat([{label:'📋 קטגוריות',back:true,action:showCategories}]));
      return;
    }

    // Final fallback
    addMsg('לא הצלחתי להבין את השאלה 🤔<br>נסו לנסח אחרת, או בחרו מהתפריט:');
    addChips([
      {label:'🟢 מה פתוח עכשיו',action:showOpenNow},
      {label:'📋 קטגוריות',action:showCategories},
      {label:'🚌 קו 10',action:showBusMenu},
      {label:'📞 טלפונים',action:showPhones},
      {label:'🚐 שאטלים',action:showShuttles},
      {label:'📑 נהלים',action:showGuidelinesMenu},
      {label:'🪖 קליטה',action:showAbsorption},
      {label:'ℹ️ דוגמאות',action:showExamples}
    ]);
  }

  // ─── Event listeners ───

  fab.addEventListener('click', async ()=>{
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      await loadData();
      if(!msgs.children.length) greet();
      setTimeout(()=>input.focus(),100);
    }
  });
  closeBtn.addEventListener('click',()=>panel.classList.remove('open'));
  sendBtn.addEventListener('click',()=>{ const v=input.value; input.value=''; processQuestion(v); });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=input.value; input.value=''; processQuestion(v); }});

  setInterval(loadData, 5*60*1000);
  loadData();
})();
</script>
